  main_image: main_image_now.png
  publish_start_at: <%= 1.month.ago.strftime('%Y-%m-%d 12:00:00 +0900') %>
  exhibit_submit_start_at: <%= 2.week.ago.strftime('%Y-%m-%d 12:00:00 +0900') %>
  exhibit_submit_end_at: <%= Time.current.tomorrow.strftime('%Y-%m-%d 12:00:00 +0900') %>

future:
