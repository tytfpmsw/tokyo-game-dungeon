past:
  name: 東京ゲームダンジョン１
  url_subdirectory: tokyo_game_dungeon_1 
  status: 2
  logo_image: logo_image_past.png
  main_image: main_image_past.png
  publish_start_at: <%= 1.year.ago.strftime('%Y-%m-%d 12:00:00 +0900') %>
  exhibit_submit_start_at: <%= (1.year.ago - 1.month).strftime('%Y-%m-%d 12:00:00 +0900') %>
  exhibit_submit_end_at: <%= (1.year.ago - 1.week).strftime('%Y-%m-%d 12:00:00 +0900') %>

