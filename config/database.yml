# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  host: 127.0.0.1

development:
  <<: *default
  database: tokyo_game_dungeon_develop
  pool: 5
  username: <%= Rails.application.credentials.database.development.user %>
  password: <%= Rails.application.credentials.database.development.password %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: tokyo_game_dungeon_test
  username: <%= Rails.application.credentials.database.test.user %>
  password: <%= Rails.application.credentials.database.test.password %>

production:
  <<: *default
  database: tokyo_game_dungeon
  username: <%= Rails.application.credentials.database.production.user %>
  password: <%= Rails.application.credentials.database.production.password %>
  host:

staging:
  <<: *default
  database: tokyo_game_dungeon_staging
  username: <%= Rails.application.credentials.database.staging.user %>
  password: <%= Rails.application.credentials.database.staging.password %>
  host: